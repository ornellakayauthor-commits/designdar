});

$('grid').addEventListener('click',function(e){
  var b=e.target.closest('button.cell'); if(!b) return;
  selected=b.dataset.date; haptic.tap(); renderCalendar(); renderDay(); renderCta();
});
var tx=null, ty=null;
$('grid').addEventListener('touchstart',function(e){ tx=e.touches[0].clientX; ty=e.touches[0].clientY; },{passive:true});
$('grid').addEventListener('touchend',function(e){
  if(tx===null) return;
  var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.5) shiftMonth(dx<0?1:-1);
  tx=ty=null;
},{passive:true});

$('ctaBtn').addEventListener('click',function(){ haptic.impact('medium'); if(tab==='layouts') openMark(); else if(tab==='rules') openNoteEdit(null,{}); else openCalc(); });

function onAct(e){
  var a=e.target.closest('[data-act]'); if(!a) return;
  var d=a.dataset;
  switch(d.act){
    case 'close': closeSheet(); break;
    case 'nfilter': haptic.tap(); noteFilter=d.f; renderNotes(); break;
    case 'note': haptic.impact('light'); noteFrom=null; openNote(d.id); break;
    case 'note-done': e.stopPropagation(); toggleNoteDone(d.id); break;
    case 'note-edit': openNoteEdit(noteState&&noteState.id); break;
    case 'note-cancel': if(noteState&&noteState.id) openNote(noteState.id); else closeSheet(); break;
    case 'note-save': saveNote(); break;
    case 'nkind': haptic.tap(); noteState.kind=d.k; a.parentNode.querySelectorAll('.tchip').forEach(function(c){ c.classList.toggle('on',c===a); }); break;
    case 'note-del': confirmNoteDel(); break;
    case 'note-del-yes': doNoteDel(); break;
    case 'note-layout': haptic.impact('light'); noteFrom=null; openLayout(d.id); break;
    case 'note-back': var fl=noteFrom; noteFrom=null; noteState=null; openLayout(fl); break;
    case 'lnote': haptic.impact('light'); noteFrom=openId; openNote(d.id); break;
    case 'lnote-add': haptic.impact('light'); noteFrom=d.id; openNoteEdit(null,{layoutId:d.id,kind:'rule'}); break;
    case 'close2': closeSheet2(); break;
    case 'back': openLayout(openId); break;
    case 'layout': haptic.impact('light'); openLayout(d.id); break;
    case 'order': haptic.impact('light'); openOrder(d.id,d.oid); break;
    case 'quick': quickMark(d.stage); break;
    case 'mv': moveCard(d.id,Number(d.dir)); break;
    case 's-open': openFromSearch(d.id); break;
    case 's-back': haptic.tap(); openSearch(searchQ||''); break;
    case 's-clear': searchQ=''; var si=$('sInput'); if(si){ si.value=''; si.focus(); } a.hidden=true; renderSearch(); break;
    case 'tcolor': haptic.tap(); typesUI.colorFor = typesUI.colorFor===d.tid ? null : d.tid; typesUI.pending=null; renderTypes(); break;
    case 'tcol-set': setTypeColor(d.tid,d.color); break;
    case 'edit': openEdit(); break;
    case 'save-edit': saveEdit(); break;
    case 'clear': var inp=$('d_'+d.stage); if(inp) inp.value=''; haptic.tap(); break;
    case 'delete': openConfirm(); break;
    case 'confirm-delete': doDelete(); break;
    case 'stage': haptic.tap(); setStage(d.stage); break;
    case 'pick': haptic.tap(); markState.pick=d.id; renderPicks(); if(d.id==='new') setTimeout(function(){ try{ $('mTitle').focus(); }catch(err){} },50); break;
    case 'save-mark': saveMark(); break;
    case 'tchip': haptic.tap(); typeSel[d.group]=d.type; a.parentNode.querySelectorAll('.tchip').forEach(function(c){ c.classList.toggle('on',c===a); }); break;
    case 'types': haptic.impact('light'); openTypes(); break;
    case 'tdel': haptic.tap(); typesUI.pending=d.tid; renderTypes(); break;
    case 'tdel-no': typesUI.pending=null; renderTypes(); break;
    case 'tdel-yes': deleteType(d.tid); break;
    case 'tadd': addType(); break;
    case 'calc-for': haptic.impact('light'); openCalc({layoutId:d.id, fixed:true}); break;
    case 'key': calcKey(d.k); break;
    case 'save-calc': saveCalc(); break;
    case 'order-edit': var l=findL(openId), o=l&&l.orders.find(function(x){ return x.id===d.oid; }); if(o) openCalc({layoutId:l.id,fixed:true,orderId:o.id,qty:o.qty,date:o.date}); break;
    case 'order-del': confirmOrderDel(d.oid); break;
    case 'order-back': openOrder(openId,d.oid); break;
    case 'order-del-yes': doOrderDel(d.oid); break;
    case 'invoice': haptic.impact('light'); openInvoice(); break;
    case 'save-invoice': saveInvoice(); break;
    case 'unpin': unpin(); break;
    case 'bg': haptic.tap(); bgState.id=d.bg; bgState.base=d.bg; applyBg(); saveBgChoice(); openBgPicker(); break;
    case 'bg-photo': if(bgState.photo){ haptic.tap(); bgState.id='photo'; applyBg(); lsSet('bgId','photo'); openBgPicker(); } else pickPhoto(); break;
    case 'bg-photo-new': pickPhoto(); break;
    case 'bg-photo-del': bgState.photo=null; lsSet('bgPhoto',null); if(bgState.id==='photo') bgState.id='pearl'; applyBg(); saveBgChoice(); haptic.note('warning'); openBgPicker(); toast('Фото убрано'); break;
  }
}
$('sheet').addEventListener('click',onAct);
$('sheet2').addEventListener('click',onAct);
$('dayList').addEventListener('click',onAct);
$('notesSec').addEventListener('click',onAct);
$('notesSec').addEventListener('keydown',function(e){ if((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('note')){ e.preventDefault(); onAct(e); } });
$('orderBtn').addEventListener('click',toggleReorder);
$('dayList').addEventListener('pointerdown',function(e){
  var g=e.target.closest('[data-grip]'); if(!g) return;
  var card=g.closest('.mark'); if(!card) return;
  e.preventDefault();
  var cards=[].slice.call($('dayList').querySelectorAll('.mark.reo'));
  var rects=cards.map(function(c){ return c.getBoundingClientRect(); });
  var from=cards.indexOf(card);
  var step=rects.length>1 ? Math.abs(rects[1].top-rects[0].top) : rects[from].height+10;
  drag={card:card,cards:cards,rects:rects,from:from,to:from,y0:e.clientY,step:step};
  try{ g.setPointerCapture(e.pointerId); }catch(err){}
  card.classList.add('dragging'); haptic.impact('light');
});
$('dayList').addEventListener('pointermove',function(e){
  if(!drag) return;
  e.preventDefault();
  var dy=e.clientY-drag.y0, r=drag.rects[drag.from];
  var min=drag.rects[0].top-r.top, max=drag.rects[drag.rects.length-1].top-r.top;
  dy=Math.max(min-12,Math.min(max+12,dy));
  drag.card.style.transform='translateY('+dy+'px) scale(1.02)';
  var center=r.top+r.height/2+dy, to=0;
  drag.rects.forEach(function(rc,i){ if(i!==drag.from && rc.top+rc.height/2<center) to++; });
  if(to!==drag.to){ drag.to=to; haptic.tap(); }
  drag.cards.forEach(function(c,i){
    if(i===drag.from) return;
    var sh=0;
    if(drag.from<to && i>drag.from && i<=to) sh=-drag.step;
    if(drag.from>to && i>=to && i<drag.from) sh=drag.step;
    c.style.transform=sh?'translateY('+sh+'px)':'';
  });
});
function endDrag(){
  if(!drag) return;
  var d=drag; drag=null;
  if(d.to!==d.from){
    var ids=d.cards.map(function(c){ return c.dataset.id; }), id=ids.splice(d.from,1)[0];
    ids.splice(d.to,0,id); applyDayOrder(ids); haptic.note('success'); render();
  } else {
    d.cards.forEach(function(c){ c.style.transform=''; }); d.card.classList.remove('dragging');
  }
}
$('dayList').addEventListener('pointerup',endDrag);
$('dayList').addEventListener('pointercancel',endDrag);
$('monthSec').addEventListener('click',onAct);
$('sheet').addEventListener('input',function(e){
  if(e.target.id!=='sInput') return;
  searchQ=e.target.value; var c=document.querySelector('#sheet .s-clear'); if(c) c.hidden=!searchQ; renderSearch();
});
$('sheet').addEventListener('keydown',function(e){ if(e.target.id==='sInput' && e.key==='Enter'){ e.preventDefault(); e.target.blur(); } });
$('sheet').addEventListener('change',function(e){
  if(e.target.id==='cLayout' && calcState){ calcState.layoutId=e.target.value; $('cNew').hidden=e.target.value!=='new'; if(e.target.value==='new') setTimeout(function(){ try{ $('cTitle').focus(); }catch(err){} },50); }
});
$('sheet2').addEventListener('change',function(e){ if(!e.target.dataset) return; if(e.target.dataset.ctid) setTypeColor(e.target.dataset.ctid,e.target.value); else if(e.target.dataset.tid) renameType(e.target); });
$('sheet2').addEventListener('keydown',function(e){ if(e.key==='Enter' && e.target.id==='newType'){ e.preventDefault(); addType(); } });
$('backdrop').addEventListener('click',closeSheet);
$('backdrop2').addEventListener('click',closeSheet2);
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ goBack(); return; }
  if(!calcState || $('sheet2').classList.contains('open')) return;
  var tag=(e.target && e.target.tagName)||'';
  if(tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT') return;
  var k=e.key;
  if(/^\d$/.test(k)) calcKey(k);
  else if(k==='+'||k==='-') calcKey(k);
  else if(k==='*'||k==='x'||k==='х') calcKey('*');
  else if(k==='Backspace'){ e.preventDefault(); calcKey('bs'); }
  else if(k==='Enter'||k==='='){ e.preventDefault(); if(/\d[+\-*]/.test(calcState.expr)) calcKey('='); else saveCalc(); }
});
try{ if(tgv('6.1')) tg.BackButton.onClick(goBack); }catch(e){}
$('state').addEventListener('click',function(e){ if(e.target.closest('[data-retry]')) load(); });

loadBg();
load();
})();
</script>
